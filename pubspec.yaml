name: devel_vpn
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.1+14

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  circle_flags: ^7.0.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  flutter_v2ray_client: ^3.5.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  mobile_scanner: ^6.0.2
  file_picker: ^10.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/logo-white.png
    - assets/svg/

  fonts:
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-Thin.ttf
          weight: 100
        - asset: assets/fonts/InterDisplay-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/InterDisplay-Light.ttf
          weight: 300
        - asset: assets/fonts/InterDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/InterDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
